name: switch-dev

on:
  workflow_dispatch:

jobs:
  build-switch-dev:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip

      - name: Configure
        run: |
          cmake \
            -S . \
            -B cmake-build \
            -G "Unix Makefiles" \
            -DPLATFORM_SWITCH=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build pfbneo
        run: |
          cd cmake-build
          make pfbneo.deps
          make pfbneo.nro

      - name: Upload Switch NRO
        uses: actions/upload-artifact@v4
        with:
          name: pfbneo-switch
          path: cmake-build/src/cores/pfbneo/pfbneo.nro
