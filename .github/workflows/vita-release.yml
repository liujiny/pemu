name: Build Vita Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-vita:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository (检出代码)
      uses: actions/checkout@v4  # 已经更新为 v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup VitaSDK (配置 Vita 工具链)
      run: |
        wget https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.540/vitasdk-x86_64-linux-gnu.tar.bz2 || wget https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.541/vitasdk-x86_64-linux-gnu.tar.bz2
        sudo tar -xjvf vitasdk-x86_64-linux-gnu.tar.bz2 -C /usr/local
        echo "VITASDK=/usr/local/vitasdk" >> $GITHUB_ENV
        echo "/usr/local/vitasdk/bin" >> $GITHUB_PATH

    - name: Install Dependencies & Tools (安装编译依赖与Vita库)
      run: |
        sudo apt-get update && sudo apt-get install -y cmake make
        # 核心补充：使用 VitaSDK 的内置包管理器 pacman 安装图形和配置依赖库
        sudo /usr/local/vitasdk/bin/pacman -Sy --noconfirm vita-freetype vita-libpng vita-zlib vita-libconfig

    - name: Configure CMake (配置构建环境)
      run: |
        mkdir build-vita && cd build-vita
        cmake -DCMAKE_TOOLCHAIN_FILE="/usr/local/vitasdk/share/vita.toolchain.cmake" -DPLATFORM_VITA=ON ..

    - name: Build FBNeo Deps (编译核心依赖)
      run: cd build-vita && make pfbneo.deps

    - name: Build Project (多线程编译主程序)
      run: cd build-vita && make -j$(nproc)

    - name: Upload Artifact (上传成品安装包)
      uses: actions/upload-artifact@v4  # 已经更新为 v4
      with:
        name: pfbneo-vita-release
        path: build-vita/**/*.vpk
