name: vita-dev

on:
  workflow_dispatch:

jobs:
  build-vita-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install build-essential cmake git zip curl

      - name: Install Vita toolchain
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH

          wget -q https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.540/vitasdk-x86_64-linux-gnu-2026-05-24_12-05-02.tar.bz2

          sudo tar -xjf vitasdk-x86_64-linux-gnu-2026-05-24_12-05-02.tar.bz2 -C /usr/local/

          vdpm libvita2d freetype bzip2 libpng libconfig zlib sdl2 curl openssl tinyxml2 libarchive minizip zstd xz

      - name: Configure
        run: |
          export VITASDK=/usr/local/vitasdk

          cmake \
            -S . \
            -B cmake-build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_VITA=ON \
            -DOPTION_MPV_PLAYER=OFF

      - name: Build pfbneo
        run: |
          cd cmake-build
          make pfbneo.deps
          make pfbneo.vpk

      - name: Upload Vita VPK
        uses: actions/upload-artifact@v4
        with:
          name: pfbneo-vita
          path: cmake-build/src/cores/pfbneo/pfbneo.vpk
